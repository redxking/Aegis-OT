name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The public-demo builder verifies retained evidence against historical
          # execution and retention commits, so a shallow checkout is insufficient.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact test environment
        run: |
          python -m pip install --constraint requirements.lock setuptools==80.9.0
          python -m pip install --constraint requirements.lock --no-build-isolation -e ".[dev,simulation]"
      - name: Lint source
        run: ruff check .
      - name: Type-check source
        run: mypy src scripts/build_public_demo.py
      - name: Verify generated schemas
        run: python scripts/export_schemas.py --check
      - name: Verify public demo
        run: python scripts/build_public_demo.py --check
      - name: Enforce branch coverage floor
        run: pytest --cov=aegis_ot --cov-branch --cov-report=term-missing --cov-fail-under=90

  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned TLC
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo "eabd140a70f49eb9305a3bd3f3df944eddf87e5a90d329789085f8953a80533a  /tmp/tla2tools.jar" \
            | sha256sum --check
      - name: Check intended and weakened formal models
        run: >-
          python scripts/run_formal.py
          --jar /tmp/tla2tools.jar
          --output-dir /tmp/aegis-formal-ci

  release-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact declared environment
        run: |
          python -m pip install --constraint requirements.lock --requirement requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Repository security policy
        run: python scripts/check_release_security.py
      - name: Installed dependency license policy
        run: python scripts/check_release_security.py --installed-licenses
      - name: Verify signed M7 provenance
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/aegis-m7-signing-key.pem
          chmod 600 /tmp/aegis-m7-signing-key.pem
          openssl pkey -in /tmp/aegis-m7-signing-key.pem -pubout \
            -out /tmp/aegis-m7-trusted-public-key.pem
          python scripts/build_m7_replication_bundle.py build \
            --output /tmp/aegis-m7-signed-bundle \
            --commit "$GITHUB_SHA" \
            --signing-private-key /tmp/aegis-m7-signing-key.pem
          python scripts/build_m7_replication_bundle.py verify \
            --bundle /tmp/aegis-m7-signed-bundle \
            --expected-commit "$GITHUB_SHA" \
            --trusted-public-key /tmp/aegis-m7-trusted-public-key.pem \
            --require-signature
      - name: Install hash-locked vulnerability scanner
        run: |
          python -m venv /tmp/aegis-security-tools
          /tmp/aegis-security-tools/bin/python -m pip install \
            --require-hashes -r security/requirements.lock
      - name: Python dependency vulnerability audit
        run: >-
          /tmp/aegis-security-tools/bin/pip-audit
          --requirement requirements.lock
          --no-deps
      - name: Secret and configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: 'secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          cache: 'false'
          version: 'v0.70.0'
          skip-setup-trivy: 'false'
      - name: Build exact-declaration container
        run: >-
          docker build
          --build-arg AEGIS_SOURCE_REVISION="$GITHUB_SHA"
          --tag "aegis-ot-ci:$GITHUB_SHA"
          .
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: 'aegis-ot-ci:${{ github.sha }}'
          scanners: 'vuln,secret,misconfig'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          ignore-unfixed: 'true'
          exit-code: '1'
          cache: 'false'
          version: 'v0.70.0'
          skip-setup-trivy: 'true'

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL static analysis
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python
          build-mode: none
      - name: Complete CodeQL static analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
