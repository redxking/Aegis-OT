<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title description">
  <title id="title">Outcome and effect state models</title>
  <desc id="description">Two related state models: the implemented capability transaction terminal classifications and the component-tested M4i effect coordination states. M4i is not wired end to end.</desc>
  <metadata>Author: Angelis Pseftis</metadata>
  <defs>
    <style>.page-title{font:700 36px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#13283f}
      .page-subtitle{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#516479}
      .lane-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#21364e}
      .section-title{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172d45}
      .box-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172d45}
      .box-text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#455970}
      .box-text-large{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#40566f}
      .body-text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#455970}
      .body-text-large{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#40566f}
      .small-text{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5a6c80}
      .line-label{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#41556c;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
      .step-number{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
      .status-text{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#26394f}
      .lane{fill:#f8fafc;stroke:#9bacc0;stroke-width:2;stroke-dasharray:9 7}
      .lane-blue{fill:#f4f8fd;stroke:#89a6c5;stroke-width:2}
      .lane-green{fill:#f2faf6;stroke:#82b69c;stroke-width:2}
      .lane-amber{fill:#fffaf0;stroke:#c89543;stroke-width:2}
      .component{fill:#fff;stroke:#2b5d92;stroke-width:2.5}
      .primary{fill:#e8f2ff;stroke:#1768a8;stroke-width:3}
      .policy{fill:#f2edff;stroke:#7050a5;stroke-width:2.5}
      .plant{fill:#e9f7ef;stroke:#27835c;stroke-width:2.5}
      .evidence{fill:#f3f5f7;stroke:#687b91;stroke-width:2.5}
      .optional{fill:#fff8e9;stroke:#b56c14;stroke-width:2;stroke-dasharray:8 6}
      .active{fill:#fff2f2;stroke:#ad4949;stroke-width:2;stroke-dasharray:8 6}
      .outside{fill:#f7f7f8;stroke:#929aa4;stroke-width:2;stroke-dasharray:7 6}
      .terminal-good{fill:#e8f7ef;stroke:#27835c;stroke-width:2.5}
      .terminal-bad{fill:#fff0f0;stroke:#ad4949;stroke-width:2.5}
      .terminal-neutral{fill:#f3f5f7;stroke:#687b91;stroke-width:2.5}
      .flow{fill:none;stroke:#2b5d92;stroke-width:3;marker-end:url(#arrow-blue)}
      .return-flow{fill:none;stroke:#27835c;stroke-width:3;marker-end:url(#arrow-green)}
      .optional-flow{fill:none;stroke:#b56c14;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-amber)}
      .active-flow{fill:none;stroke:#ad4949;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-red)}
      .evidence-flow{fill:none;stroke:#687b91;stroke-width:3;marker-end:url(#arrow-gray)}
      .connector{stroke:#93a4b7;stroke-width:2;fill:none}
      .bus{stroke:#2b5d92;stroke-width:3;fill:none}
      .lifeline{stroke:#9bacc0;stroke-width:2;stroke-dasharray:7 6}
      .divider{stroke:#d7dee7;stroke-width:2}
      .status-implemented{fill:#e8f7ef;stroke:#27835c;stroke-width:1.5}
      .status-retained{fill:#e8f2ff;stroke:#1768a8;stroke-width:1.5}
      .status-optional{fill:#fff8e9;stroke:#b56c14;stroke-width:1.5}
      .status-active{fill:#fff2f2;stroke:#ad4949;stroke-width:1.5}
      .status-outside{fill:#f3f5f7;stroke:#929aa4;stroke-width:1.5}
      .phase-band{fill:#f8fafc;stroke:none}
      .phase-band-alt{fill:#eef5fb;stroke:none}
      .phase-label{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#687b91;letter-spacing:1px}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b5d92"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#27835c"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b56c14"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4949"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687b91"/></marker>
  </defs>
  <rect width="1600" height="1030" fill="#fff"/>
  <text x="64" y="54" class="page-title">Outcome and effect state models</text>
  <text x="64" y="83" class="page-subtitle">Implemented capability disposition above • M4i coordination model below</text>
  <rect x="45" y="115" width="1510" height="420" rx="18" class="lane-blue"/>
  <text x="69" y="147" class="lane-title" text-anchor="start">Implemented capability terminal classification</text>
  <rect x="80" y="175" width="240" height="70" rx="14" class="primary"/>
  <text x="200" y="204" class="box-title" text-anchor="middle">Prerequisite gates</text>
  <text x="200" y="233" class="box-text" text-anchor="middle"><tspan x="200" dy="0">before PLC call</tspan></text>
  <rect x="470" y="175" width="240" height="70" rx="14" class="policy"/>
  <text x="590" y="204" class="box-title" text-anchor="middle">PLC gateway called</text>
  <text x="590" y="233" class="box-text" text-anchor="middle"><tspan x="590" dy="0">at most once</tspan></text>
  <rect x="860" y="175" width="285" height="70" rx="14" class="evidence"/>
  <text x="1002" y="204" class="box-title" text-anchor="middle">ACK + post evidence</text>
  <text x="1002" y="233" class="box-text" text-anchor="middle"><tspan x="1002" dy="0">verify transaction bindings</tspan></text>
  <polyline points="320,210 470,210" class="flow"/>
  <text x="395" y="194" class="line-label" text-anchor="middle">permitted candidate</text>
  <polyline points="710,210 860,210" class="flow"/>
  <text x="785" y="194" class="line-label" text-anchor="middle">signed ACK</text>
  <rect x="55" y="365" width="220" height="105" rx="14" class="terminal-neutral"/>
  <text x="165" y="395" class="box-title" text-anchor="middle">not_dispatched</text>
  <text x="165" y="424" class="box-text" text-anchor="middle"><tspan x="165" dy="0">known before call</tspan><tspan x="165" dy="23">dispatch_attempts = 0</tspan></text>
  <rect x="305" y="365" width="220" height="105" rx="14" class="terminal-bad"/>
  <text x="415" y="395" class="box-title" text-anchor="middle">candidate_rejected</text>
  <text x="415" y="424" class="box-text" text-anchor="middle"><tspan x="415" dy="0">unsafe/misbound candidate</tspan><tspan x="415" dy="23">or signed attestation reject</tspan></text>
  <rect x="555" y="365" width="220" height="105" rx="14" class="terminal-bad"/>
  <text x="665" y="395" class="box-title" text-anchor="middle">plc_rejected</text>
  <text x="665" y="424" class="box-text" text-anchor="middle"><tspan x="665" dy="0">valid signed reject ACK</tspan><tspan x="665" dy="23">known no effect</tspan></text>
  <rect x="805" y="365" width="220" height="105" rx="14" class="active"/>
  <text x="915" y="395" class="box-title" text-anchor="middle">unknown_effect</text>
  <text x="915" y="424" class="box-text" text-anchor="middle"><tspan x="915" dy="0">consequential evidence</tspan><tspan x="915" dy="23">missing / invalid / uncertain</tspan></text>
  <rect x="1055" y="365" width="220" height="105" rx="14" class="active"/>
  <text x="1165" y="395" class="box-title" text-anchor="middle">observation_diverged</text>
  <text x="1165" y="424" class="box-text" text-anchor="middle"><tspan x="1165" dy="0">applied ACK contradicts</tspan><tspan x="1165" dy="23">valid signed post-state</tspan></text>
  <rect x="1305" y="365" width="220" height="105" rx="14" class="terminal-good"/>
  <text x="1415" y="395" class="box-title" text-anchor="middle">completed</text>
  <text x="1415" y="424" class="box-text" text-anchor="middle"><tspan x="1415" dy="0">applied ACK matches</tspan><tspan x="1415" dy="23">signed post-state</tspan></text>
  <polyline points="200,245 165,365" class="flow"/>
  <polyline points="280,245 415,365" class="flow"/>
  <polyline points="570,245 665,365" class="flow"/>
  <polyline points="650,245 915,365" class="flow"/>
  <polyline points="1000,245 1165,365" class="flow"/>
  <polyline points="1060,245 1415,365" class="flow"/>
  <text x="800" y="510" class="small-text" text-anchor="middle">No automatic retry after consequential dispatch • terminal status is bounded transaction evidence, not field validation</text>
  <rect x="45" y="580" width="1510" height="355" rx="18" class="lane-amber"/>
  <text x="69" y="612" class="lane-title" text-anchor="start">M4i effect-coordinator state machine • active development</text>
  <rect x="85" y="650" width="200" height="65" rx="14" class="primary"/>
  <text x="185" y="690" class="box-title" text-anchor="middle">RECEIVED</text>
  <rect x="355" y="650" width="250" height="65" rx="14" class="policy"/>
  <text x="480" y="690" class="box-title" text-anchor="middle">DISPATCH_ARMED</text>
  <rect x="690" y="650" width="270" height="65" rx="14" class="policy"/>
  <text x="825" y="690" class="box-title" text-anchor="middle">COMMIT_ACCEPTED</text>
  <rect x="1085" y="620" width="190" height="65" rx="14" class="terminal-good"/>
  <text x="1180" y="660" class="box-title" text-anchor="middle">APPLIED</text>
  <rect x="1325" y="620" width="190" height="65" rx="14" class="terminal-bad"/>
  <text x="1420" y="660" class="box-title" text-anchor="middle">REJECTED</text>
  <rect x="1085" y="785" width="430" height="85" rx="14" class="active"/>
  <text x="1300" y="814" class="box-title" text-anchor="middle">UNKNOWN_EFFECT</text>
  <text x="1300" y="843" class="box-text" text-anchor="middle"><tspan x="1300" dy="0">query may resolve to APPLIED or REJECTED</tspan></text>
  <rect x="355" y="810" width="250" height="65" rx="14" class="terminal-neutral"/>
  <text x="480" y="850" class="box-title" text-anchor="middle">NOT_DISPATCHED</text>
  <polyline points="285,682 355,682" class="flow"/>
  <text x="320" y="666" class="line-label" text-anchor="middle">prepare</text>
  <polyline points="605,682 690,682" class="flow"/>
  <text x="647" y="666" class="line-label" text-anchor="middle">commit</text>
  <polyline points="960,672 1085,652" class="flow"/>
  <polyline points="960,688 1000,688 1000,725 1420,725 1420,685" class="flow"/>
  <polyline points="825,715 1085,827" class="flow"/>
  <polyline points="185,715 185,842 355,842" class="flow"/>
  <polyline points="480,715 480,810" class="flow"/>
  <polyline points="1150,785 1035,745 1035,600 1180,600 1180,620" class="return-flow"/>
  <polyline points="1450,785 1525,745 1525,590 1420,590 1420,620" class="return-flow"/>
  <text x="800" y="915" class="small-text" text-anchor="middle">Nonterminal knowledge states: COMMIT_ACCEPTED, UNKNOWN_EFFECT • terminal: NOT_DISPATCHED, APPLIED, REJECTED</text>
  <rect x="80" y="965" width="178" height="28" rx="14" class="status-active"/>
  <text x="169" y="984" class="status-text" text-anchor="middle">NOT WIRED END TO END</text>
  <text x="1515" y="985" class="small-text" text-anchor="end">No retained campaign • no consensus • no exactly-once-effect claim</text>
</svg>
