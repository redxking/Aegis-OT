<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Assurance overlay stack</title>
  <desc id="description">Each overlay extends the layers below it. The final coordination overlay is optional, has retained single-host evidence, and is not the default control path.</desc>
  <metadata>Author: Angelis Pseftis</metadata>
  <defs>
    <style>.page-title{font:700 36px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#13283f}
      .page-subtitle{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#516479}
      .lane-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#21364e}
      .section-title{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172d45}
      .box-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172d45}
      .box-text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#455970}
      .box-text-large{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#40566f}
      .body-text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#455970}
      .body-text-large{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#40566f}
      .small-text{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5a6c80}
      .line-label{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#41556c;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
      .step-number{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
      .status-text{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#26394f}
      .lane{fill:#f8fafc;stroke:#9bacc0;stroke-width:2;stroke-dasharray:9 7}
      .lane-blue{fill:#f4f8fd;stroke:#89a6c5;stroke-width:2}
      .lane-green{fill:#f2faf6;stroke:#82b69c;stroke-width:2}
      .lane-amber{fill:#fffaf0;stroke:#c89543;stroke-width:2}
      .component{fill:#fff;stroke:#2b5d92;stroke-width:2.5}
      .primary{fill:#e8f2ff;stroke:#1768a8;stroke-width:3}
      .policy{fill:#f2edff;stroke:#7050a5;stroke-width:2.5}
      .plant{fill:#e9f7ef;stroke:#27835c;stroke-width:2.5}
      .evidence{fill:#f3f5f7;stroke:#687b91;stroke-width:2.5}
      .optional{fill:#fff8e9;stroke:#b56c14;stroke-width:2;stroke-dasharray:8 6}
      .active{fill:#fff2f2;stroke:#ad4949;stroke-width:2;stroke-dasharray:8 6}
      .outside{fill:#f7f7f8;stroke:#929aa4;stroke-width:2;stroke-dasharray:7 6}
      .terminal-good{fill:#e8f7ef;stroke:#27835c;stroke-width:2.5}
      .terminal-bad{fill:#fff0f0;stroke:#ad4949;stroke-width:2.5}
      .terminal-neutral{fill:#f3f5f7;stroke:#687b91;stroke-width:2.5}
      .flow{fill:none;stroke:#2b5d92;stroke-width:3;marker-end:url(#arrow-blue)}
      .return-flow{fill:none;stroke:#27835c;stroke-width:3;marker-end:url(#arrow-green)}
      .optional-flow{fill:none;stroke:#b56c14;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-amber)}
      .active-flow{fill:none;stroke:#ad4949;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-red)}
      .evidence-flow{fill:none;stroke:#687b91;stroke-width:3;marker-end:url(#arrow-gray)}
      .connector{stroke:#93a4b7;stroke-width:2;fill:none}
      .bus{stroke:#2b5d92;stroke-width:3;fill:none}
      .lifeline{stroke:#9bacc0;stroke-width:2;stroke-dasharray:7 6}
      .divider{stroke:#d7dee7;stroke-width:2}
      .status-implemented{fill:#e8f7ef;stroke:#27835c;stroke-width:1.5}
      .status-retained{fill:#e8f2ff;stroke:#1768a8;stroke-width:1.5}
      .status-optional{fill:#fff8e9;stroke:#b56c14;stroke-width:1.5}
      .status-active{fill:#fff2f2;stroke:#ad4949;stroke-width:1.5}
      .status-outside{fill:#f3f5f7;stroke:#929aa4;stroke-width:1.5}
      .phase-band{fill:#f8fafc;stroke:none}
      .phase-band-alt{fill:#eef5fb;stroke:none}
      .phase-label{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#687b91;letter-spacing:1px}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b5d92"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#27835c"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b56c14"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4949"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687b91"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="64" y="54" class="page-title">Assurance overlay stack</text>
  <text x="64" y="83" class="page-subtitle">Compose overlays are ordered experiments, not features enabled by the default command</text>
  <rect x="220" y="130" width="1160" height="66" rx="12" class="primary"/>
  <text x="244" y="157" class="box-title" text-anchor="start">BASE</text>
  <text x="425" y="157" class="line-label" text-anchor="start">docker-compose.yml</text>
  <text x="425" y="181" class="small-text" text-anchor="start">Segmentation • OPA • observer • OT adapter • synthetic plant</text>
  <rect x="1208" y="148" width="154" height="28" rx="14" class="status-retained"/>
  <text x="1285" y="167" class="status-text" text-anchor="middle">RETAINED EVIDENCE</text>
  <polyline points="800,196 800,221" class="optional-flow"/>
  <rect x="220" y="221" width="1160" height="66" rx="12" class="component"/>
  <text x="244" y="248" class="box-title" text-anchor="start">AUTH</text>
  <text x="425" y="248" class="line-label" text-anchor="start">docker-compose.auth.yml</text>
  <text x="425" y="272" class="small-text" text-anchor="start">Signed request envelopes • audience • freshness</text>
  <rect x="1208" y="239" width="154" height="28" rx="14" class="status-retained"/>
  <text x="1285" y="258" class="status-text" text-anchor="middle">RETAINED EVIDENCE</text>
  <polyline points="800,287 800,312" class="optional-flow"/>
  <rect x="220" y="312" width="1160" height="66" rx="12" class="component"/>
  <text x="244" y="339" class="box-title" text-anchor="start">REPLAY</text>
  <text x="425" y="339" class="line-label" text-anchor="start">docker-compose.replay.yml</text>
  <text x="425" y="363" class="small-text" text-anchor="start">Persistent exact-envelope replay ledger</text>
  <rect x="1208" y="330" width="154" height="28" rx="14" class="status-retained"/>
  <text x="1285" y="349" class="status-text" text-anchor="middle">RETAINED EVIDENCE</text>
  <polyline points="800,378 800,403" class="optional-flow"/>
  <rect x="220" y="403" width="1160" height="66" rx="12" class="component"/>
  <text x="244" y="430" class="box-title" text-anchor="start">CAPABILITY</text>
  <text x="425" y="430" class="line-label" text-anchor="start">docker-compose.capability.yml</text>
  <text x="425" y="454" class="small-text" text-anchor="start">Signed observation • candidate simulation • signed permit • plant ACK</text>
  <rect x="1254" y="421" width="108" height="28" rx="14" class="status-implemented"/>
  <text x="1308" y="440" class="status-text" text-anchor="middle">IMPLEMENTED</text>
  <polyline points="800,469 800,494" class="optional-flow"/>
  <rect x="220" y="494" width="1160" height="66" rx="12" class="component"/>
  <text x="244" y="521" class="box-title" text-anchor="start">IDENTITY</text>
  <text x="425" y="521" class="line-label" text-anchor="start">docker-compose.identity.yml</text>
  <text x="425" y="545" class="small-text" text-anchor="start">Application workload credentials • trust bundle • semantic replay</text>
  <rect x="1208" y="512" width="154" height="28" rx="14" class="status-retained"/>
  <text x="1285" y="531" class="status-text" text-anchor="middle">RETAINED EVIDENCE</text>
  <polyline points="800,560 800,585" class="optional-flow"/>
  <rect x="220" y="585" width="1160" height="66" rx="12" class="optional"/>
  <text x="244" y="612" class="box-title" text-anchor="start">SPIRE</text>
  <text x="425" y="612" class="line-label" text-anchor="start">docker-compose.spire.yml</text>
  <text x="425" y="636" class="small-text" text-anchor="start">SPIFFE X.509-SVID issuance • internal mTLS</text>
  <rect x="1136" y="603" width="226" height="28" rx="14" class="status-optional"/>
  <text x="1249" y="622" class="status-text" text-anchor="middle">OPTIONAL • NO RETAINED RUN</text>
  <polyline points="800,651 800,676" class="optional-flow"/>
  <rect x="220" y="676" width="1160" height="66" rx="12" class="component"/>
  <text x="244" y="703" class="box-title" text-anchor="start">COORDINATION</text>
  <text x="425" y="703" class="line-label" text-anchor="start">docker-compose.coordination.yml</text>
  <text x="425" y="727" class="small-text" text-anchor="start">Two journals • prepare / commit / query protocol</text>
  <rect x="1112" y="694" width="250" height="28" rx="14" class="status-retained"/>
  <text x="1237" y="713" class="status-text" text-anchor="middle">RETAINED SINGLE-HOST EVIDENCE</text>
  <rect x="40" y="130" width="145" height="66" rx="14" class="terminal-good"/>
  <text x="112" y="155" class="box-title" text-anchor="middle">Default</text>
  <text x="112" y="184" class="box-text" text-anchor="middle"><tspan x="112" dy="0">base only</tspan></text>
  <polyline points="185,163 220,163" class="return-flow"/>
  <rect x="220" y="785" width="1160" height="58" rx="12" class="evidence"/>
  <text x="800" y="820" class="body-text" text-anchor="middle">M4i is exercised through the optional coordination overlay; the default gateway remains non-coordinated and required mode rejects the legacy execute path.</text>
</svg>
