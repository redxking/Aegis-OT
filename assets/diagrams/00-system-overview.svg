  <rect width="1600" height="1000" fill="#fff"/>
  <text x="64" y="54" class="page-title">Aegis-OT segmented capability architecture</text>
  <text x="64" y="83" class="page-subtitle">Current single-host research configuration • simulated OT only</text>
  <rect x="45" y="110" width="1510" height="590" rx="18" class="lane"/>
  <text x="69" y="142" class="lane-title" text-anchor="start">Consequence path</text>
  <rect x="75" y="325" width="205" height="105" rx="14" class="component"/>
  <text x="177" y="359" class="box-title" text-anchor="middle">Bounded agent</text>
  <text x="177" y="388" class="box-text-large" text-anchor="middle"><tspan x="177" dy="0">ActionProposal</tspan><tspan x="177" dy="25">No plant access</tspan></text>
  <rect x="350" y="285" width="275" height="185" rx="14" class="primary"/>
  <text x="487" y="319" class="box-title" text-anchor="middle">Segmented gateway</text>
  <text x="487" y="348" class="box-text-large" text-anchor="middle"><tspan x="487" dy="0">Sole authorization route</tspan><tspan x="487" dy="25">Identity + delegation</tspan><tspan x="487" dy="25">Policy + replay + safety</tspan><tspan x="487" dy="25">Evidence + disposition</tspan></text>
  <rect x="375" y="175" width="225" height="75" rx="14" class="policy"/>
  <text x="487" y="209" class="box-title" text-anchor="middle">OPA policy</text>
  <text x="487" y="238" class="box-text-large" text-anchor="middle"><tspan x="487" dy="0">Context policy</tspan></text>
  <rect x="735" y="225" width="280" height="85" rx="14" class="component"/>
  <text x="875" y="259" class="box-title" text-anchor="middle">Signed observer</text>
  <text x="875" y="288" class="box-text-large" text-anchor="middle"><tspan x="875" dy="0">Signed pre/post state</tspan></text>
  <rect x="735" y="340" width="280" height="85" rx="14" class="component"/>
  <text x="875" y="374" class="box-title" text-anchor="middle">Candidate evaluator</text>
  <text x="875" y="403" class="box-text-large" text-anchor="middle"><tspan x="875" dy="0">Non-mutating simulation</tspan></text>
  <rect x="735" y="455" width="280" height="85" rx="14" class="component"/>
  <text x="875" y="489" class="box-title" text-anchor="middle">OT adapter</text>
  <text x="875" y="518" class="box-text-large" text-anchor="middle"><tspan x="875" dy="0">Permit check + sole apply</tspan></text>
  <rect x="1170" y="295" width="270" height="170" rx="14" class="plant"/>
  <text x="1305" y="329" class="box-title" text-anchor="middle">Synthetic plant</text>
  <text x="1305" y="358" class="box-text-large" text-anchor="middle"><tspan x="1305" dy="0">Authoritative lab state</tspan><tspan x="1305" dy="25">capture • simulate</tspan><tspan x="1305" dy="25">apply + readback</tspan></text>
  <rect x="700" y="122" width="780" height="88" rx="12" class="optional"/>
  <text x="724" y="151" class="section-title" text-anchor="start">OPTIONAL IDENTITY + TRANSPORT OVERLAY</text>
  <text x="724" y="176" class="body-text" text-anchor="start">Application workload credentials • SPIRE X.509-SVID • mTLS</text>
  <text x="724" y="198" class="body-text" text-anchor="start">App credentials: agent, gateway, OT • SPIRE SVIDs: gateway, observer, candidate, OT, plant</text>
  <polyline points="280,378 350,378" class="flow"/>
  <text x="315" y="363" class="line-label" text-anchor="middle">proposal</text>
  <polyline points="488,285 488,250" class="flow"/>
  <text x="548" y="273" class="line-label" text-anchor="middle">policy check</text>
  <line x1="625" y1="378" x2="675" y2="378" class="connector"/>
  <line x1="675" y1="268" x2="675" y2="498" class="connector"/>
  <polyline points="675,268 735,268" class="flow"/>
  <text x="713" y="251" class="line-label" text-anchor="middle">observe</text>
  <polyline points="675,383 735,383" class="flow"/>
  <text x="713" y="366" class="line-label" text-anchor="middle">simulate</text>
  <polyline points="675,498 735,498" class="flow"/>
  <text x="713" y="481" class="line-label" text-anchor="middle">dispatch</text>
  <line x1="1015" y1="268" x2="1085" y2="268" class="connector"/>
  <line x1="1015" y1="383" x2="1085" y2="383" class="connector"/>
  <line x1="1015" y1="498" x2="1085" y2="498" class="connector"/>
  <line x1="1085" y1="268" x2="1085" y2="498" class="connector"/>
  <polyline points="1085,383 1170,383" class="return-flow"/>
  <rect x="350" y="585" width="1090" height="74" rx="12" class="evidence"/>
  <text x="375" y="615" class="section-title" text-anchor="start">M4i EFFECT COORDINATION • BOUNDED OPTIONAL OVERLAY</text>
  <text x="375" y="641" class="body-text" text-anchor="start">Gateway journal  ↔  signed prepare / commit / query  ↔  effect-coordinator journal</text>
  <text x="1415" y="641" class="body-text" text-anchor="end">Retained single-host campaign • no exactly-once claim</text>
  <rect x="45" y="735" width="1510" height="185" rx="18" class="lane"/>
  <text x="69" y="767" class="lane-title" text-anchor="start">Separate read-only evidence path</text>
  <rect x="185" y="800" width="225" height="78" rx="14" class="evidence"/>
  <text x="297" y="845" class="box-title" text-anchor="middle">Browser / reviewer</text>
  <rect x="570" y="800" width="285" height="78" rx="14" class="evidence"/>
  <text x="712" y="829" class="box-title" text-anchor="middle">Public evidence demo</text>
  <text x="712" y="858" class="box-text-large" text-anchor="middle"><tspan x="712" dy="0">127.0.0.1:8080 • GET only</tspan></text>
  <rect x="1040" y="800" width="300" height="78" rx="14" class="evidence"/>
  <text x="1190" y="829" class="box-title" text-anchor="middle">Packaged evidence.json</text>
  <text x="1190" y="858" class="box-text-large" text-anchor="middle"><tspan x="1190" dy="0">Built from retained M2/M3</tspan></text>
  <polyline points="410,839 570,839" class="evidence-flow"/>
  <polyline points="1040,839 855,839" class="evidence-flow"/>
  <text x="1515" y="965" class="small-text" text-anchor="end">Research evidence ≠ deployment validation</text>
</svg>
