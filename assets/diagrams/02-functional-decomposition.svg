<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Functional decomposition and decision responsibility</title>
  <desc id="description">A functional view of the implemented decision path. It distinguishes input validation, authorization, consequence-path services, outcome classification, and retained evidence responsibilities.</desc>
  <metadata>Author: Angelis Pseftis</metadata>
  <defs>
    <style>.page-title{font:700 36px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#13283f}
      .page-subtitle{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#516479}
      .lane-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#21364e}
      .section-title{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172d45}
      .box-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172d45}
      .box-text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#455970}
      .box-text-large{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#40566f}
      .body-text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#455970}
      .body-text-large{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#40566f}
      .small-text{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5a6c80}
      .line-label{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#41556c;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
      .step-number{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
      .status-text{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#26394f}
      .lane{fill:#f8fafc;stroke:#9bacc0;stroke-width:2;stroke-dasharray:9 7}
      .lane-blue{fill:#f4f8fd;stroke:#89a6c5;stroke-width:2}
      .lane-green{fill:#f2faf6;stroke:#82b69c;stroke-width:2}
      .lane-amber{fill:#fffaf0;stroke:#c89543;stroke-width:2}
      .component{fill:#fff;stroke:#2b5d92;stroke-width:2.5}
      .primary{fill:#e8f2ff;stroke:#1768a8;stroke-width:3}
      .policy{fill:#f2edff;stroke:#7050a5;stroke-width:2.5}
      .plant{fill:#e9f7ef;stroke:#27835c;stroke-width:2.5}
      .evidence{fill:#f3f5f7;stroke:#687b91;stroke-width:2.5}
      .optional{fill:#fff8e9;stroke:#b56c14;stroke-width:2;stroke-dasharray:8 6}
      .active{fill:#fff2f2;stroke:#ad4949;stroke-width:2;stroke-dasharray:8 6}
      .outside{fill:#f7f7f8;stroke:#929aa4;stroke-width:2;stroke-dasharray:7 6}
      .terminal-good{fill:#e8f7ef;stroke:#27835c;stroke-width:2.5}
      .terminal-bad{fill:#fff0f0;stroke:#ad4949;stroke-width:2.5}
      .terminal-neutral{fill:#f3f5f7;stroke:#687b91;stroke-width:2.5}
      .flow{fill:none;stroke:#2b5d92;stroke-width:3;marker-end:url(#arrow-blue)}
      .return-flow{fill:none;stroke:#27835c;stroke-width:3;marker-end:url(#arrow-green)}
      .optional-flow{fill:none;stroke:#b56c14;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-amber)}
      .active-flow{fill:none;stroke:#ad4949;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-red)}
      .evidence-flow{fill:none;stroke:#687b91;stroke-width:3;marker-end:url(#arrow-gray)}
      .connector{stroke:#93a4b7;stroke-width:2;fill:none}
      .bus{stroke:#2b5d92;stroke-width:3;fill:none}
      .lifeline{stroke:#9bacc0;stroke-width:2;stroke-dasharray:7 6}
      .divider{stroke:#d7dee7;stroke-width:2}
      .status-implemented{fill:#e8f7ef;stroke:#27835c;stroke-width:1.5}
      .status-retained{fill:#e8f2ff;stroke:#1768a8;stroke-width:1.5}
      .status-optional{fill:#fff8e9;stroke:#b56c14;stroke-width:1.5}
      .status-active{fill:#fff2f2;stroke:#ad4949;stroke-width:1.5}
      .status-outside{fill:#f3f5f7;stroke:#929aa4;stroke-width:1.5}
      .phase-band{fill:#f8fafc;stroke:none}
      .phase-band-alt{fill:#eef5fb;stroke:none}
      .phase-label{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#687b91;letter-spacing:1px}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b5d92"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#27835c"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b56c14"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4949"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687b91"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="64" y="54" class="page-title">Functional decomposition and decision responsibility</text>
  <text x="64" y="83" class="page-subtitle">Authorization produces a decision; only a permit can continue to controlled execution</text>
  <rect x="45" y="120" width="1510" height="805" rx="18" class="lane-blue"/>
  <text x="69" y="152" class="lane-title" text-anchor="start">Aegis-OT functional boundary</text>
  <rect x="75" y="180" width="220" height="150" rx="14" class="component"/>
  <text x="185" y="214" class="box-title" text-anchor="middle">Proposal intake</text>
  <text x="185" y="243" class="box-text" text-anchor="middle"><tspan x="185" dy="0">Schema validation</tspan><tspan x="185" dy="23">Action + target</tspan><tspan x="185" dy="23">Context + correlation</tspan></text>
  <rect x="350" y="180" width="250" height="150" rx="14" class="component"/>
  <text x="475" y="214" class="box-title" text-anchor="middle">Precondition evidence</text>
  <text x="475" y="243" class="box-text" text-anchor="middle"><tspan x="475" dy="0">Fresh signed capture</tspan><tspan x="475" dy="23">Plant revision binding</tspan><tspan x="475" dy="23">Observation correlation</tspan></text>
  <rect x="655" y="150" width="420" height="210" rx="14" class="primary"/>
  <text x="865" y="184" class="box-title" text-anchor="middle">Independent authorization</text>
  <text x="865" y="213" class="box-text" text-anchor="middle"><tspan x="865" dy="0">Actor authority + optional workload credential</tspan><tspan x="865" dy="23">Delegation scope and audience</tspan><tspan x="865" dy="23">Freshness and replay resistance</tspan><tspan x="865" dy="23">OPA contextual policy</tspan><tspan x="865" dy="23">Safety envelope + approval reference</tspan></text>
  <rect x="1130" y="180" width="390" height="150" rx="14" class="terminal-neutral"/>
  <text x="1325" y="214" class="box-title" text-anchor="middle">Decision result</text>
  <text x="1325" y="243" class="box-text" text-anchor="middle"><tspan x="1325" dy="0">permit → consequence path</tspan><tspan x="1325" dy="23">deny → no dispatch</tspan><tspan x="1325" dy="23">require approval → no dispatch</tspan></text>
  <rect x="1200" y="460" width="300" height="150" rx="14" class="component"/>
  <text x="1350" y="494" class="box-title" text-anchor="middle">Candidate evaluation</text>
  <text x="1350" y="523" class="box-text" text-anchor="middle"><tspan x="1350" dy="0">Non-mutating simulate</tspan><tspan x="1350" dy="23">Modeled safety result</tspan><tspan x="1350" dy="23">Signed response</tspan></text>
  <rect x="825" y="460" width="300" height="150" rx="14" class="policy"/>
  <text x="975" y="494" class="box-title" text-anchor="middle">Capability issuance</text>
  <text x="975" y="523" class="box-text" text-anchor="middle"><tspan x="975" dy="0">Signed permit</tspan><tspan x="975" dy="23">Bound action + snapshot</tspan><tspan x="975" dy="23">Expiry + correlation</tspan></text>
  <rect x="450" y="460" width="300" height="150" rx="14" class="component"/>
  <text x="600" y="494" class="box-title" text-anchor="middle">Controlled execution</text>
  <text x="600" y="523" class="box-text" text-anchor="middle"><tspan x="600" dy="0">Verify permit</tspan><tspan x="600" dy="23">Dispatch once</tspan><tspan x="600" dy="23">Acknowledge + readback</tspan></text>
  <rect x="75" y="460" width="300" height="150" rx="14" class="evidence"/>
  <text x="225" y="494" class="box-title" text-anchor="middle">Outcome evidence</text>
  <text x="225" y="523" class="box-text" text-anchor="middle"><tspan x="225" dy="0">Post-capture correlation</tspan><tspan x="225" dy="23">Terminal classification</tspan><tspan x="225" dy="23">Reason code + hashes</tspan></text>
  <rect x="300" y="680" width="1000" height="115" rx="14" class="terminal-neutral"/>
  <text x="800" y="714" class="box-title" text-anchor="middle">Terminal disposition</text>
  <text x="800" y="743" class="box-text" text-anchor="middle"><tspan x="800" dy="0">not_dispatched • candidate_rejected • plc_rejected</tspan><tspan x="800" dy="23">unknown_effect • observation_diverged • completed</tspan></text>
  <polyline points="295,255 350,255" class="flow"/>
  <polyline points="600,255 655,255" class="flow"/>
  <polyline points="1075,255 1130,255" class="flow"/>
  <polyline points="1350,330 1350,460" class="flow"/>
  <text x="1400" y="405" class="line-label" text-anchor="middle">permit only</text>
  <polyline points="1200,535 1125,535" class="flow"/>
  <polyline points="825,535 750,535" class="flow"/>
  <polyline points="450,535 375,535" class="evidence-flow"/>
  <polyline points="225,610 225,650 500,650 500,680" class="evidence-flow"/>
  <text x="365" y="640" class="line-label" text-anchor="middle">classify</text>
  <polyline points="1350,610 1350,650 1100,650 1100,680" class="evidence-flow"/>
  <text x="1225" y="640" class="line-label" text-anchor="middle">unsafe or misbound</text>
  <polyline points="1520,255 1535,255 1535,737 1300,737" class="evidence-flow"/>
  <text x="1440" y="670" class="line-label" text-anchor="middle">deny or approval required</text>
  <rect x="150" y="835" width="1380" height="70" rx="12" class="optional"/>
  <text x="175" y="866" class="section-title" text-anchor="start">APPROVAL BOUNDARY</text>
  <text x="515" y="867" class="body-text" text-anchor="start">Current implementation checks that an approval reference is present when required; it does not validate an approval authority or signature.</text>
  <text x="1510" y="965" class="small-text" text-anchor="end">Enumerated but not emitted by the current gateway: quarantine • modify • defer • simulate • revoke</text>
</svg>
