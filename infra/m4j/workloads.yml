  plant:
    role: simulation
    activation: continuous
    image: application
    listener: plant-api
    registration: plant
    command:
      - python
      - -m
      - aegis_ot.spire_mtls
      - serve
      - --app
      - aegis_ot.segmented_capability_runtime:capability_plant_app
      - --host
      - 192.168.60.15
      - --port
      - "8084"
      - --expected-spiffe-id
      - spiffe://aegis-ot.m4g.local/workload/plant
      - --allowed-client-spiffe-id
      - spiffe://aegis-ot.m4g.local/workload/observer
      - --allowed-client-spiffe-id
      - spiffe://aegis-ot.m4g.local/workload/candidate
      - --allowed-client-spiffe-id
      - spiffe://aegis-ot.m4g.local/workload/ot-adapter
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
      AEGIS_SPIFFE_ID: spiffe://aegis-ot.m4g.local/workload/plant
