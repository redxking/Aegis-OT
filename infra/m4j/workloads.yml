      AEGIS_SPIRE_MTLS_TMPDIR: /run/aegis-spire-mtls
      AEGIS_CANDIDATE_KEY_ID: m4g-candidate-key-v1
      AEGIS_CANDIDATE_PUBLIC_KEY_FILE: /run/secrets/candidate.public
      AEGIS_OBSERVER_KEY_ID: m4g-observer-key-v1
      AEGIS_OBSERVER_PUBLIC_KEY_FILE: /run/secrets/observer.public
      AEGIS_OT_KEY_ID: ${secrets.key_ids.ot}
      AEGIS_OT_PUBLIC_KEY_FILE: /run/secrets/ot.public
      AEGIS_PLANT_KEY_ID: m4g-plant-key-v1
      AEGIS_PLANT_PRIVATE_KEY_FILE: /run/secrets/plant.private
      AEGIS_EFFECT_COORDINATION_MODE: required
      AEGIS_PLANT_CHECKPOINT_FILE: /var/lib/aegis-ot/plant-checkpoint/plant-checkpoint.json
    host_aliases: {}
    secret_files: [candidate.public, observer.public, ot.public, plant.private]
    identity_files: []
    state_mounts:
      - host: plant-checkpoint
        container: /var/lib/aegis-ot/plant-checkpoint
